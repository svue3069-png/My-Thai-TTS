<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Inner traditional decorative circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="172" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Soundwave / Thai Ranat curve -->
  <path d="M 120 370 Q 256 420 392 370" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="160" cy="380" r="7" fill="#34d399"/>
  <circle cx="208" cy="392" r="7" fill="#34d399"/>
  <circle cx="256" cy="396" r="8" fill="#fbbf24"/>
  <circle cx="304" cy="392" r="7" fill="#34d399"/>
  <circle cx="352" cy="380" r="7" fill="#34d399"/>

  <!-- Traditional Thai Kanok Crown / Flame Motif at top -->
  <path d="M 256 112 C 248 135 240 155 230 170 C 242 165 256 160 256 142 C 256 160 270 165 282 170 C 272 155 264 135 256 112 Z" fill="url(#goldGrad)"/>

  <!-- Thai Character 'ไ' (Thai letter for Thai Speech) stylized with classical flame elegance -->
  <g fill="url(#goldGrad)" transform="translate(0, -10)">
    <path d="M 226 210 C 215 210 205 218 205 230 C 205 242 215 250 226 250 C 238 250 248 240 248 230 C 248 218 238 210 226 210 Z"/>
    <!-- Stem of ไ -->
    <path d="M 220 245 L 220 345 C 220 350 224 354 230 354 C 236 354 240 350 240 345 L 240 245 Z"/>
    <!-- Crown of ไ waving upwards -->
    <path d="M 226 215 C 220 185 245 165 270 175 C 285 180 295 195 285 210 C 278 200 270 195 260 195 C 245 195 235 205 238 220 Z"/>
  </g>

  <!-- Musical Notes accents -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Note 1 -->
    <ellipse cx="325" cy="270" rx="14" ry="10" transform="rotate(-20 325 270)"/>
    <rect x="334" y="210" width="5" height="58" rx="2"/>
    <path d="M 338 210 Q 360 215 355 235 Q 345 225 338 225 Z"/>
  </g>
</svg>
